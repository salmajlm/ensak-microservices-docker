services:
  # ---------- Service ETUDIANTS ----------
  etudiants-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ensak
      POSTGRES_PASSWORD: ensak
      POSTGRES_DB: etudiants
    volumes:
      - etudiants-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ensak -d etudiants"]
      interval: 5s
      retries: 10

  etudiants:
    build: ./etudiants-service
    environment:
      DATABASE_URL: postgresql://ensak:ensak@etudiants-db:5432/etudiants
    ports:
      - "5001:5000"
    depends_on:
      etudiants-db:
        condition: service_healthy

  # ---------- Service COURS ----------
  cours-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ensak
      POSTGRES_PASSWORD: ensak
      POSTGRES_DB: cours
    volumes:
      - cours-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ensak -d cours"]
      interval: 5s
      retries: 10

  cours:
    build: ./cours-service
    environment:
      DATABASE_URL: postgresql://ensak:ensak@cours-db:5432/cours
    ports:
      - "5002:5000"
    depends_on:
      cours-db:
        condition: service_healthy

  # ---------- Service NOTES ----------
  notes-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ensak
      POSTGRES_PASSWORD: ensak
      POSTGRES_DB: notes
    volumes:
      - notes-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ensak -d notes"]
      interval: 5s
      retries: 10

  notes:
    build: ./notes-service
    environment:
      DATABASE_URL: postgresql://ensak:ensak@notes-db:5432/notes
      ETUDIANTS_URL: http://etudiants:5000
      COURS_URL: http://cours:5000
    ports:
      - "5003:5000"
    depends_on:
      notes-db:
        condition: service_healthy
      etudiants:
        condition: service_started
      cours:
        condition: service_started

  # ---------- API GATEWAY ----------
  gateway:
    image: nginx:alpine
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend:/usr/share/nginx/html:ro
    ports:
      - "8080:80"
    depends_on:
      - etudiants
      - cours
      - notes

volumes:
  etudiants-data:
  cours-data:
  notes-data:
