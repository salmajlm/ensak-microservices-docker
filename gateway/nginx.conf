# API Gateway : porte d'entree unique de l'application
# - sert la page web (frontend)
# - redirige chaque URL vers le bon microservice

server {
    listen 80;

    # DNS interne de Docker : retrouve les services par leur nom,
    # meme s'ils redemarrent ou s'ils sont dupliques (scaling)
    resolver 127.0.0.11 valid=10s;

    # ---------- Frontend ----------
    location / {
        root /usr/share/nginx/html;
        index index.html;
    }

    # ---------- Routage vers les microservices ----------
    location /etudiants {
        set $etudiants http://etudiants:5000;
        proxy_pass $etudiants;
    }

    location /cours {
        set $cours http://cours:5000;
        proxy_pass $cours;
    }

    location /notes {
        set $notes http://notes:5000;
        proxy_pass $notes;
    }

    # ---------- Etat de sante de chaque service ----------
    location = /health {
        default_type application/json;
        return 200 '{"status":"ok","service":"gateway"}';
    }

    location = /status/etudiants {
        set $h http://etudiants:5000/health;
        proxy_pass $h;
    }

    location = /status/cours {
        set $h http://cours:5000/health;
        proxy_pass $h;
    }

    location = /status/notes {
        set $h http://notes:5000/health;
        proxy_pass $h;
    }
}
